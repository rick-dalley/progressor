name: triage
description: "Progressor — a clinician's caseload tracker, from intake to release."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  material_symbols_icons: ^4.2928.1
  google_fonts: ^8.0.2
  http: ^1.2.1
  sqflite: ^2.3.3+1
  url_launcher: ^6.3.0
  path: ^1.9.0
  uuid: ^4.4.0
  permission_handler: ^13.0.0
  camera: ^0.12.0+1
  image_picker: ^1.2.2
  # speech_to_text: ^7.4.0
  path_provider: ^2.1.3
  fl_chart: ^1.2.0
  app_links: ^6.4.0
  carbon_ui:
    path: ../carbon_ui
  # Apple Vision on iOS, ML Kit on Android (ML Kit's iOS pods can't run on arm64 simulators).
  cwicare_vision:
    path: ../cwicare_vision
  # FDA-label interaction data and lookups, shared with Ally and Acuitage.
  cwicare_interactions:
    path: ../cwicare_interactions

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The core SQLite engine for Flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/assessment/
    - assets/conditions/
    - assets/drugs/
    - assets/images/
    - assets/images/faces/
    - assets/medications/
    - assets/observations/
    - assets/patients/
    - assets/process/
    - assets/questionnaires/
    - assets/questions/
    - assets/screen_captures/
    - assets/sql/
    - assets/staff/
flutter_intl:
  enabled: true

dependency_overrides:
  # permission_handler 13.0.0's constraint is loose enough that pub resolves
  # permission_handler_android to 14.0.0, whose build.gradle.kts references AGP 9 but
  # never applies the Kotlin Gradle plugin, so the Android build breaks under this app's
  # AGP 8.9. 13.0.1 is the version aligned with permission_handler 13.x. (Same pin as Ally.)
  permission_handler_android: 13.0.1
